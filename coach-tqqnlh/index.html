<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PT 노트 선생님 · GYMTOS 도당점</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17294B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PT노트 쌤">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="/assets/icon-coach-192.png">
<link rel="apple-touch-icon" href="/assets/icon-coach-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<style>
.wrap { padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
.sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sum div { background: var(--paper); border-radius: 14px; padding: 12px 8px; text-align: center; box-shadow: 0 1px 2px rgba(30, 35, 48, .06); }
.sum b { display: block; font-size: 24px; font-weight: 900; color: var(--primary); font-variant-numeric: tabular-nums; line-height: 1.2; }
.sum b.ok { color: var(--good); }
.sum small { font-size: 12px; color: var(--faint); font-weight: 700; }
.mlist { display: flex; flex-direction: column; gap: 10px; }
.mcard { background: var(--paper); border-radius: 16px; padding: 14px; box-shadow: 0 1px 2px rgba(30, 35, 48, .06); display: flex; flex-direction: column; gap: 12px; }
.mtop { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.av { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 20px; font-weight: 900; flex: none; }
.av.M { background: #1F3864; } .av.F { background: #C2185B; }
.mtop > div { flex: 1; min-width: 0; }
.mtop h3 { margin: 0; font-size: 17px; line-height: 1.3; }
.mtop p { margin: 2px 0 0; font-size: 12.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st { flex: none; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; padding: 6px 8px; border-radius: 12px; background: #EEF0F4; color: var(--sub); }
.st b { font-size: 13px; line-height: 1.2; }
.st small { font-size: 11px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.st.on { background: var(--good-tint); color: var(--good); }
.st.rest { background: #F1F2F5; color: #A3A9B5; }
.st.wait { opacity: .6; }
.mrow2 { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--sub); }
.mrow2 b { color: var(--ink); font-variant-numeric: tabular-nums; }
.qlinks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.qlinks a { text-align: center; text-decoration: none; font-size: 13px; font-weight: 700; color: var(--primary); background: var(--tint); border-radius: 10px; padding: 9px 4px; }
.qlinks a.F { color: #C2185B; background: #FCE4EC; }
.qlinks a:focus-visible, .mtop:focus-visible { outline: 3px solid var(--key); outline-offset: 2px; }
.refresh { font: inherit; font-size: 13px; font-weight: 700; color: var(--primary); background: none; border: 0; cursor: pointer; margin-left: auto; padding: 4px; }
.howto { font-size: 13px; color: var(--sub); line-height: 1.6; }
.howto b { color: var(--ink); }
</style>
</head>
<body>
<header class="bar"><div class="bar-in"><img src="/assets/logo.png" alt="GYMTOS"><span>선생님 페이지</span></div></header>
<main class="wrap">
  <div class="hero"><div class="hero-main"><div class="hero-l">
    <div class="eyebrow">MY MEMBERS <b>· 담당 회원 PT 노트</b></div>
    <h1>장동욱 트레이너</h1>
    <div class="en" id="sub">GYMTOS 도당점</div>
  </div></div></div>

  <section>
    <div class="head"><h2>오늘 한눈에</h2><p id="today"></p><button class="refresh" id="refresh" type="button">새로고침</button></div>
    <div class="sum">
      <div><b class="ok" id="sOn">–</b><small>오늘 출석</small></div>
      <div><b id="sWait">–</b><small>아직</small></div>
      <div><b id="sAll">–</b><small>담당 회원</small></div>
    </div>
  </section>

  <section>
    <div class="head"><h2>회원 목록</h2><p>이름을 누르면 그 회원님 PT 노트로</p></div>
    <div class="mlist" id="list"><div class="panel empty"><h3>불러오는 중…</h3></div></div>
  </section>

  <section>
    <div class="head"><h2>앱처럼 쓰기</h2></div>
    <div class="panel howto">
      <p style="margin:0 0 6px"><b>아이폰</b> 사파리에서 이 페이지 열기 → 아래 공유 버튼 → <b>홈 화면에 추가</b></p>
      <p style="margin:0">갤럭시 크롬에서 이 페이지 열기 → 오른쪽 위 ⋮ → <b>홈 화면에 추가 / 앱 설치</b></p>
      <p style="margin:8px 0 0;color:var(--faint);font-size:12px">이 주소는 선생님만 아시면 돼요. 회원님께는 각자 PT 노트 주소만 보내주세요.</p>
    </div>
  </section>
</main>
<script src="members.js"></script>
<script>
(function () {
  "use strict";
  var API = "https://script.google.com/macros/s/AKfycbwtjTpk88xTWQcKXoaFX2qCYtKSzKoCOs-Us26k6QUbtKvewTaqJutJuA4RJjAmV-6bvA/exec";
  var LIST = window.COACH_MEMBERS || [];
  var DK = ["일", "월", "화", "수", "목", "금", "토"];
  try { sessionStorage.setItem("ptcoach", location.pathname); localStorage.setItem("ptcoach", location.pathname); } catch (e) {}

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var now = new Date(), today = ymd(now);
  document.getElementById("today").textContent = (now.getMonth() + 1) + "월 " + now.getDate() + "일 " + DK[now.getDay()] + "요일";
  document.getElementById("sAll").textContent = LIST.length;
  document.getElementById("sub").textContent = "GYMTOS 도당점 · 담당 회원 " + LIST.length + "명";

  function loadMember(slug) {
    return fetch("/m/" + slug + "/data.js", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
      var w = {}; new Function("window", t)(w); return w.MEMBER;
    });
  }
  function journeyText(M) {
    if (!M.journey || !M.journey.start) return "";
    var p = M.journey.start.split("-"), st = new Date(+p[0], +p[1] - 1, +p[2]);
    var el = (Date.now() - st.getTime()) / (86400000 * 30.44);
    var mo = Math.max(1, Math.min(12, Math.floor(el) + 1)), stage = el < 2 ? "1단계 기초" : el < 7 ? "2단계 변화" : "3단계 자립";
    return mo + "개월차 · " + stage;
  }
  function isRestToday(M) {
    var R = M.routine; if (!R || R.rotation) return false;
    var key = DK[now.getDay()];
    for (var i = 0; i < R.days.length; i++) if (R.days[i].day === key) return !!R.days[i].rest;
    return false;
  }
  function card(slug, M, days) {
    var sex = M.sex === "F" ? "F" : "M", base = "/m/" + slug + "/";
    var on = days && days[today] != null, rest = isRestToday(M);
    var st = !days ? '<span class="st wait"><b>확인 중</b><small>…</small></span>'
      : on ? '<span class="st on"><b>✓ 출석</b><small>' + esc(days[today] || "") + '</small></span>'
      : rest ? '<span class="st rest"><b>쉬는 날</b><small>루틴상</small></span>'
      : '<span class="st"><b>아직</b><small>미체크</small></span>';
    var info = "";
    if (days) {
      var ym = today.slice(0, 7), cnt = 0, last = "";
      Object.keys(days).forEach(function (k) { if (k.slice(0, 7) === ym) cnt++; if (k > last) last = k; });
      info = '<span>이번 달 출석 <b>' + cnt + '회</b></span><span>마지막 <b>' + (last ? (+last.slice(5, 7)) + "/" + (+last.slice(8)) : "없음") + '</b></span>';
    }
    var R = M.routine || {};
    info += '<span>루틴 <b>' + esc(R.version || "–") + '</b></span><span>복습지 <b>' + (M.forms || []).length + '개</b></span>';
    var jt = journeyText(M);
    return '<div class="mcard"><a class="mtop" href="' + base + '#home"><span class="av ' + sex + '">' + esc(M.name.charAt(0)) + '</span>' +
      '<div><h3>' + esc(M.name) + ' 회원님</h3><p>' + esc(M.goal || "") + (jt ? ' · ' + jt : '') + '</p></div>' + st + '</a>' +
      '<div class="mrow2">' + info + '</div>' +
      '<div class="qlinks"><a class="' + sex + '" href="' + base + '#home">홈</a><a class="' + sex + '" href="' + base + '#goal">출석·목표</a>' +
      '<a class="' + sex + '" href="' + base + '#routine">루틴</a><a class="' + sex + '" href="' + base + '#forms">복습지</a></div></div>';
  }
  function render() {
    var box = document.getElementById("list");
    Promise.all(LIST.map(function (slug) {
      return loadMember(slug).then(function (M) { return { slug: slug, M: M }; }).catch(function () { return null; });
    })).then(function (rows) {
      rows = rows.filter(Boolean);
      box.innerHTML = rows.map(function (r) { return card(r.slug, r.M, null); }).join("");
      var done = 0, onN = 0, restN = 0;
      rows.forEach(function (r, i) {
        fetch(API + "?m=" + encodeURIComponent(r.slug), { cache: "no-store" }).then(function (x) { return x.json(); })
          .then(function (j) { return j && j.ok ? j.days : {}; }).catch(function () { return {}; })
          .then(function (days) {
            var el = box.children[i]; if (el) el.outerHTML = card(r.slug, r.M, days);
            if (days[today] != null) onN++; else if (isRestToday(r.M)) restN++;
            done++;
            document.getElementById("sOn").textContent = onN;
            document.getElementById("sWait").textContent = done === rows.length ? (rows.length - onN - restN) : "…";
          });
      });
    });
  }
  render();
  document.getElementById("refresh").addEventListener("click", render);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
